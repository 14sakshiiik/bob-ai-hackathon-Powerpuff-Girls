submission:
  title: "Cyber Fraud Network Analyzer"

  problem_statement: >
    Cyber-forensics investigations often involve scattered cyber-fraud
    intelligence, including transaction records, call logs, device IDs,
    account details, accused names, and timestamps. Investigators need
    a way to connect these entities, understand relationships, identify
    suspicious network structures, and organize evidence for further
    investigation.

  solution_summary: >
    Cyber Fraud Network Analyzer is an AI-assisted cyber-forensics
    investigation tool designed to transform scattered fraud-related
    data into a connected network of entities and relationships.
    The initial version focuses on degree centrality, betweenness
    centrality, money-flow imbalance, and shared-device detection.
    The planned workflow uses Python-based network analysis and
    IBM Bob with MCP integration to explain findings and prepare
    a structured, FIR-ready investigation brief.

  key_features:
    - "Degree centrality analysis to identify highly connected entities"
    - "Betweenness centrality analysis to identify entities connecting different parts of the network"
    - "Money-flow imbalance analysis comparing funds received and sent"
    - "Shared-device detection to identify accounts associated with common device identifiers"
    - "AI-assisted investigation explanations and structured case briefs using IBM Bob and MCP integration"

  tech_stack:
    languages:
      - "Python"
    frameworks: []
    ibm_technologies:
      - "IBM Bob"
      - "Model Context Protocol (MCP)"
    databases: []
    other:
      - "NetworkX"
      - "Mock / File-based Fraud Data"
      - "Git"
      - "GitHub"

  what_we_are_most_proud_of: >
    Our project focuses on connecting fragmented cyber-fraud information
    into a network that investigators can examine more easily.
    By combining network centrality, financial-flow analysis, and
    shared-device relationships, the system aims to highlight
    investigation priorities and explain why particular entities
    deserve further examination.

  known_limitations: >
    The initial version is intended to use mock or file-based
    demonstration data rather than live banking, telecom, or police
    systems. Advanced enhancements planned for later versions include
    unusually large transfers, rapid and repeated money movement,
    device-to-account concentration, communication and financial
    relationship analysis, PageRank, and multi-hop connection analysis.
    Network indicators are investigative signals and do not establish
    criminal activity or prove that an entity is a kingpin or money mule.

